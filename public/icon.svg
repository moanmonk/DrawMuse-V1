<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="penBody" x1="160" y1="360" x2="300" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#E0734C"/>
    </linearGradient>
    <linearGradient id="goldStar" x1="320" y1="120" x2="420" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5C06B"/>
      <stop offset="100%" stop-color="#D49A3D"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="102" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- DrawMuse Pencil Nib / Artist Feather Motif -->
  <g transform="translate(10, 10)">
    <!-- Main Stylized Diagonal Quill/Pencil Blade -->
    <path d="M140 370 L190 410 L350 200 C370 174 380 130 380 130 C380 130 336 140 310 160 L140 370 Z" fill="url(#penBody)"/>
    
    <!-- Metallic Nib Tip -->
    <path d="M140 370 L110 420 L190 410 Z" fill="#F7F4EE"/>
    
    <!-- Slit in Nib -->
    <line x1="150" y1="415" x2="220" y2="325" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="220" cy="325" r="5" fill="#18181b"/>

    <!-- Gold Accent Swirl Line -->
    <path d="M110 420 Q180 340 310 160" stroke="#F5C06B" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Vibrant 4-Point Sparkle Star (Top-Right Muse Sparkle) -->
    <path d="M380 140 C380 100 390 90 430 90 C390 90 380 80 380 40 C380 80 370 90 330 90 C370 90 380 100 380 140 Z" fill="url(#goldStar)"/>

    <!-- Secondary Small Sparkle -->
    <path d="M280 100 C280 80 285 75 305 75 C285 75 280 70 280 50 C280 70 275 75 255 75 C275 75 280 80 280 100 Z" fill="#F7F4EE" opacity="0.85"/>
  </g>
</svg>
